name: Build a firmware on demand

on:
  workflow_dispatch:
    inputs:
      keyboard:
        description: 'Keyboard'
        required: true
        type: choice
        options:
        - keyball39
        - keyball44
        - keyball61
        - keyball46
        - one47
      keymap:
        description: 'Keymap'
        required: true
        type: string
        default: 'penguin4glte'
      qmk_version:
        description: 'QMK version (tag)'
        required: true
        type: string
        default: '0.33.8'

jobs:

  build:

    uses: ./.github/workflows/build-firmware.yml
    with:
      qmk_version: ${{ inputs.qmk_version }}
      keyboard:    ${{ inputs.keyboard }}
      keymap:      ${{ inputs.keymap }}
